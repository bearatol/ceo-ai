name: Bug or installation problem
description: Report a reproducible problem. English, Russian and Chinese are welcome.
body:
  - type: markdown
    attributes:
      value: |
        For a vulnerability, use the private reporting instructions in SECURITY.md.
        Do not post secrets, private prompts, project files or personal paths here.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Tool and version, operating system, CEO AI version or commit, installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Minimal steps, expected and actual result, and the exact redacted error.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed credentials and private content from this report.
          required: true
