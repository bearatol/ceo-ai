name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'-B','-m','unittest','discover','-s','tests'],check=True,timeout=30)"
      - name: Package integrity
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'-B','scripts/check.py'],check=True,timeout=30)"
      - name: Documentation links
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'-B','scripts/check_docs.py'],check=True,timeout=30)"
